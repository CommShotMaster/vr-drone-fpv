<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VR Drone FPV</title>
<style>
  html,body{margin:0;height:100%;background:#0b1220;overflow:hidden;font-family:system-ui,sans-serif}
  #help{position:fixed;left:12px;bottom:12px;color:#cfe3ff;font-size:13px;line-height:1.5;
        background:#0008;padding:10px 14px;border-radius:8px;pointer-events:none}
  #help b{color:#7dffb0}
</style>
<script type="importmap">
{"imports":{
  "three":"./lib/three.module.js",
  "three/addons/":"./lib/"
}}
</script>
</head>
<body>
<div id="help">
  <b>Desktop</b> W/S throttle · A/D yaw · Arrows pitch/roll · R restart · or use a gamepad<br>
  <b>VR</b> Left stick: throttle · flick left/right to snap-turn · Right stick: pitch/roll · A/B/X/Y: restart<br>
  Fly through the glowing rings. Hitting something sends you back to the last ring (+5s).
</div>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');
// head starts at origin => eyes sit at the drone camera
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc8f0);
scene.fog = new THREE.Fog(0x9cc8f0, 60, 420);

const camera = new THREE.PerspectiveCamera(85, innerWidth / innerHeight, 0.05, 800);
const rig = new THREE.Group();       // the "drone": moves in the world, carries the camera
rig.add(camera);
scene.add(rig);

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.1));
const sun = new THREE.DirectionalLight(0xfff2d0, 1.6);
sun.position.set(80, 140, 40);
scene.add(sun);

// ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000),
  new THREE.MeshLambertMaterial({ color: 0x3a4a3a })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const grid = new THREE.GridHelper(2000, 400, 0x5d7a5d, 0x4b624b);
grid.position.y = 0.02;
scene.add(grid);

// ---------- course ----------
function rng(seed){ return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const rand = rng(1337);

const RING_R = 3.6;
const rings = [];     // {pos: Vec3, dir: Vec3, mesh, beam}
{
  let p = new THREE.Vector3(0, 6, -30), heading = 0;
  for (let i = 0; i < 14; i++) {
    heading += (rand() - 0.5) * 1.3;
    const step = 38 + rand() * 20;
    p = p.clone().add(new THREE.Vector3(Math.sin(heading) * step, 0, -Math.cos(heading) * step));
    p.y = THREE.MathUtils.clamp(p.y + (rand() - 0.4) * 14, 3, 40);
    const dir = new THREE.Vector3(Math.sin(heading), 0, -Math.cos(heading));
    rings.push({ pos: p.clone(), dir });
  }
}
const ringGeo = new THREE.TorusGeometry(RING_R, 0.22, 12, 40);
const beamGeo = new THREE.CylinderGeometry(0.15, 0.15, 120, 8, 1, true);
rings.forEach((r) => {
  r.mesh = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({ color: 0x334455, emissive: 0x000000 }));
  r.mesh.position.copy(r.pos);
  r.mesh.lookAt(r.pos.clone().add(r.dir));
  scene.add(r.mesh);
  r.beam = new THREE.Mesh(beamGeo, new THREE.MeshBasicMaterial({ color: 0x33ff88, transparent: true, opacity: 0.35 }));
  r.beam.position.copy(r.pos).add(new THREE.Vector3(0, 60, 0));
  r.beam.visible = false;
  scene.add(r.beam);
});

// buildings (instanced), kept clear of the flight path
const boxes = []; // {min,max}
{
  const N = 700;
  const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: 0xffffff }), N);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  let n = 0;
  const pathPts = [new THREE.Vector3(0, 0, 0), ...rings.map(r => r.pos)];
  for (let tries = 0; tries < 4000 && n < N; tries++) {
    const x = (rand() - 0.5) * 900, z = -rand() * 800 + 100;
    const w = 8 + rand() * 20, d = 8 + rand() * 20, h = 8 + rand() * 60;
    const clear = pathPts.every(q => Math.hypot(q.x - x, q.z - z) > 22 + Math.max(w, d) / 2);
    if (!clear) continue;
    const nearRing = rings.some(r => {
      const cx = Math.max(x - w / 2, Math.min(r.pos.x, x + w / 2)), cy = Math.max(0, Math.min(r.pos.y, h)), cz = Math.max(z - d / 2, Math.min(r.pos.z, z + d / 2));
      return Math.hypot(cx - r.pos.x, cy - r.pos.y, cz - r.pos.z) < RING_R + 12;
    });
    if (nearRing) continue;
    m.compose(new THREE.Vector3(x, h / 2, z), new THREE.Quaternion(), new THREE.Vector3(w, h, d));
    inst.setMatrixAt(n, m);
    inst.setColorAt(n, c.setHSL(0.58 + rand() * 0.08, 0.12 + rand() * 0.2, 0.35 + rand() * 0.3));
    boxes.push({ min: new THREE.Vector3(x - w / 2, 0, z - d / 2), max: new THREE.Vector3(x + w / 2, h, z + d / 2) });
    n++;
  }
  inst.count = n;
  scene.add(inst);
}

// ---------- HUD (canvas on a panel locked to the rig) ----------
const hudCanvas = document.createElement('canvas');
hudCanvas.width = 1024; hudCanvas.height = 384;
const hudCtx = hudCanvas.getContext('2d');
const hudTex = new THREE.CanvasTexture(hudCanvas);
const hud = new THREE.Mesh(
  new THREE.PlaneGeometry(0.9, 0.3375),
  new THREE.MeshBasicMaterial({ map: hudTex, transparent: true, depthTest: false })
);
hud.renderOrder = 999;
hud.position.set(0, -0.42, -1.3);
camera.add(hud);

// full-view fade (crash / snap-turn comfort blink)
const fade = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0, depthTest: false, depthWrite: false }));
fade.renderOrder = 1000; fade.position.z = -0.2; fade.frustumCulled = false; fade.visible = false;
camera.add(fade);
let blink = 0, lastErr = '';
addEventListener('error', e => { lastErr = String(e.message || e).slice(0, 70); });
addEventListener('unhandledrejection', e => { lastErr = String(e.reason).slice(0, 70); }); // desktop: sticks to camera. In VR it is re-parented to rig below.

// ---------- drone state ----------
const G = 9.81, MAX_TILT = THREE.MathUtils.degToRad(52), YAW_RATE = 2.2, DRAG = 0.45, CAM_UPTILT = THREE.MathUtils.degToRad(22);
const drone = {
  pos: new THREE.Vector3(0, 2, 0), vel: new THREE.Vector3(),
  yaw: 0, pitch: 0, roll: 0,
};
let nextRing = 0, elapsed = 0, penalty = 0, finished = false, crashFlash = 0;
let respawn = { pos: new THREE.Vector3(0, 2, 0), yaw: 0 };

function doRespawn(applyPenalty) {
  drone.pos.copy(respawn.pos); drone.vel.set(0, 0, 0);
  drone.yaw = respawn.yaw; drone.pitch = drone.roll = 0;
  if (applyPenalty) { penalty += 5; crashFlash = 0.6; }
}
function restart() {
  nextRing = 0; elapsed = 0; penalty = 0; finished = false;
  respawn = { pos: new THREE.Vector3(0, 2, 0), yaw: 0 };
  doRespawn(false); updateRingVisuals();
}
function updateRingVisuals() {
  rings.forEach((r, i) => {
    const done = i < nextRing, cur = i === nextRing && !finished;
    r.mesh.material.color.set(done ? 0x225533 : cur ? 0x33ff88 : 0x334455);
    r.mesh.material.emissive.set(cur ? 0x22cc66 : 0x000000);
    r.beam.visible = cur;
  });
}
restart();

// ---------- input ----------
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyR') restart(); });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let snapHeld = false, faceHeld = false;
const SNAP = THREE.MathUtils.degToRad(30);
const dz = v => Math.abs(v) < 0.08 ? 0 : v;
function readInput() {
  const k = (a, b) => (keys[a] ? 1 : 0) - (keys[b] ? 1 : 0);
  let thr = k('KeyW', 'KeyS'), yaw = k('KeyD', 'KeyA'), pit = k('ArrowUp', 'ArrowDown'), rol = k('ArrowRight', 'ArrowLeft');
  let trigger = false, snap = 0, face = false;

  const session = renderer.xr.getSession();
  if (session) {
    for (const src of session.inputSources) {
      const gp = src.gamepad; if (!gp) continue;
      const ax = gp.axes, x = ax[2] ?? ax[0] ?? 0, y = ax[3] ?? ax[1] ?? 0;
      if (src.handedness === 'left')  { thr += -dz(y); const sx = Math.abs(x) > 0.7 ? Math.sign(x) : 0; if (sx && !snapHeld) snap = sx; snapHeld = !!sx; }
      if (src.handedness === 'right') { pit += -dz(y); rol += dz(x); }
      if (gp.buttons[0]?.pressed) trigger = true;
      if (gp.buttons[4]?.pressed || gp.buttons[5]?.pressed) face = true;
    }
  } else {
    for (const gp of navigator.getGamepads?.() ?? []) {
      if (!gp) continue;
      thr += -dz(gp.axes[1] ?? 0); yaw += dz(gp.axes[0] ?? 0);
      rol += dz(gp.axes[2] ?? 0);  pit += -dz(gp.axes[3] ?? 0);
      if (gp.buttons[0]?.pressed) trigger = true;
      break;
    }
  }
  const c = v => Math.max(-1, Math.min(1, v));
  const faceEdge = face && !faceHeld; faceHeld = face;
  return { thr: c(thr), yaw: c(yaw), pit: c(pit), rol: c(rol), trigger, snap, restart: faceEdge };
}

// ---------- audio (starts on first user gesture / entering VR) ----------
const sfx = (() => {
  let ac, hum, humGain;
  function init() {
    if (ac) { ac.resume?.(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    hum = ac.createOscillator(); hum.type = 'sawtooth'; hum.frequency.value = 90;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
    humGain = ac.createGain(); humGain.gain.value = 0.04;
    hum.connect(lp).connect(humGain).connect(ac.destination); hum.start();
  }
  function tone(f, d, type = 'sine', v = 0.2, slide = 0) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
  }
  ['pointerdown', 'keydown', 'click'].forEach(e => addEventListener(e, init));
  renderer.xr.addEventListener('sessionstart', init);
  return {
    ding() { tone(880, 0.25, 'sine', 0.25); setTimeout(() => tone(1320, 0.3, 'sine', 0.25), 90); },
    crash() { tone(160, 0.4, 'sawtooth', 0.3, 40); },
    update(thr, spd) { if (hum) { hum.frequency.value = 80 + (thr + 1) * 40 + spd * 1.5; } },
  };
})();

// ---------- simulation ----------
const _q = new THREE.Quaternion(), _e = new THREE.Euler(0, 0, 0, 'YXZ'), _up = new THREE.Vector3(), _c = new THREE.Vector3(), _acc = new THREE.Vector3(), _Y = new THREE.Vector3(0, 1, 0);

function hitsBuilding(p, r) {
  for (const b of boxes) {
    _c.set(
      Math.max(b.min.x, Math.min(p.x, b.max.x)),
      Math.max(b.min.y, Math.min(p.y, b.max.y)),
      Math.max(b.min.z, Math.min(p.z, b.max.z)));
    if (_c.distanceToSquared(p) < r * r) return true;
  }
  return false;
}

function step(dt, inp) {
  // attitude: stick sets target tilt ("angle mode"), smoothed
  const k = 1 - Math.exp(-9 * dt);
  drone.pitch += (inp.pit * MAX_TILT - drone.pitch) * k;
  drone.roll  += (inp.rol * MAX_TILT - drone.roll) * k;
  drone.yaw   -= inp.yaw * YAW_RATE * dt;
  if (inp.snap) { drone.yaw -= inp.snap * SNAP; blink = 0.12; }

  _e.set(-drone.pitch, drone.yaw, -drone.roll, 'YXZ');
  _q.setFromEuler(_e);
  _up.set(0, 1, 0).applyQuaternion(_q);

  // thrust: hover at stick centre, tilt-compensated so tilting doesn't drop you
  const thrust = G * (1 + inp.thr * 1.1) / Math.max(_up.y, 0.55);
  const acc = _acc.copy(_up).multiplyScalar(thrust); acc.y -= G; acc.addScaledVector(drone.vel, -DRAG);
  drone.vel.addScaledVector(acc, dt);
  drone.pos.addScaledVector(drone.vel, dt);

  // collisions
  if (drone.pos.y < 0.25) {
    if (drone.vel.y < -7) { doRespawn(true); sfx.crash(); return; }
    drone.pos.y = 0.25; if (drone.vel.y < 0) drone.vel.y = 0;
    drone.vel.x *= 0.9; drone.vel.z *= 0.9;
  }
  if (hitsBuilding(drone.pos, 0.35)) { doRespawn(true); sfx.crash(); return; }

  // rings
  if (!finished) {
    const r = rings[nextRing];
    if (drone.pos.distanceTo(r.pos) < RING_R * 0.85) {
      respawn = { pos: r.pos.clone().addScaledVector(r.dir, 2), yaw: Math.atan2(-r.dir.x, -r.dir.z) };
      nextRing++; sfx.ding();
      if (nextRing >= rings.length) finished = true;
      updateRingVisuals();
    }
  }
}

function applyToRig(inVR) {
  rig.position.copy(drone.pos);
  if (inVR) {
    // comfort: only yaw is applied in VR; pitch/roll would be nauseating without a cockpit
    rig.quaternion.setFromAxisAngle(_Y, drone.yaw);
    if (hud.parent !== rig) { rig.add(hud); hud.position.set(0, -0.3, -1.0); }
  } else {
    _e.set(-drone.pitch + CAM_UPTILT, drone.yaw, -drone.roll, 'YXZ'); // FPV camera uptilt
    rig.quaternion.setFromEuler(_e);
    if (hud.parent !== camera) { camera.add(hud); hud.position.set(0, -0.42, -1.3); }
  }
}

let hudTimer = 0;
function drawHud() {
  const ctx = hudCtx, w = hudCanvas.width, h = hudCanvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.fillStyle = crashFlash > 0 ? '#ff3b3bcc' : '#06121ecc';
  ctx.fillRect(0, 0, w / 2, h / 2);
  ctx.fillStyle = '#7dffb0'; ctx.font = 'bold 34px monospace';
  const t = (elapsed + penalty).toFixed(1);
  const spd = (drone.vel.length() * 3.6).toFixed(0);
  ctx.fillText(finished ? `FINISHED  ${t}s` : `TIME ${t}s`, 18, 48);
  ctx.fillText(`RING ${Math.min(nextRing + 1, rings.length)}/${rings.length}`, 18, 92);
  ctx.fillText(`${spd} km/h   ALT ${drone.pos.y.toFixed(0)}m`, 18, 136);
  ctx.font = '22px monospace'; ctx.fillStyle = '#cfe3ff';
  const d = finished ? '' : `next: ${drone.pos.distanceTo(rings[nextRing].pos).toFixed(0)}m`;
  ctx.fillText(lastErr ? 'ERR ' + lastErr : finished ? 'A / R to restart' : `${d}   penalty +${penalty}s`, 18, 176);
  hudTex.needsUpdate = true;
}

// ---------- loop ----------
let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const inp = readInput();
  if ((finished && inp.trigger) || inp.restart) restart();
  if (!finished) elapsed += dt;
  crashFlash = Math.max(0, crashFlash - dt);
  step(dt, inp);
  applyToRig(renderer.xr.isPresenting);
  blink = Math.max(0, blink - dt);
  const fa = Math.min(0.6, Math.max(crashFlash / 0.6 * 0.6, blink / 0.12 * 0.6));
  fade.visible = fa > 0.01; fade.material.opacity = fa; fade.material.color.set(crashFlash > 0 ? 0x550000 : 0x000000);
  sfx.update(inp.thr, drone.vel.length());
  if ((hudTimer -= dt) <= 0) { drawHud(); hudTimer = 0.1; }
  rings.forEach((r, i) => { if (i === nextRing) r.mesh.rotation.z += dt * 1.5; });
  renderer.render(scene, camera);
});
</script>
</body>
</html>
